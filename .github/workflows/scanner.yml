name: BNBPRINT Scanner

# Replaces an always-on Railway/Render process with a free, scheduled one.
#
# How this stays "near real-time" for $0/month: each run doesn't just do
# one quick check and exit — it loops internally for up to ~5h45m (see
# SCAN_LOOP_BUDGET_SECONDS in backend/scan_runner.py), polling every ~15s.
# The `schedule` trigger below just needs to fire a fresh run every 5h as a
# safety net *before* the previous run's internal budget expires, so there's
# always an overlapping run in flight and no real gap in coverage. Standard
# GitHub-hosted runners are free with no time limit on public repositories,
# so running near-continuously like this costs nothing.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN   (from upstash.com, free)
#   RPC_HTTPS_URL                                       (only needed once DEMO_MODE=false)
#   RPC_HTTPS_URL_FALLBACK                              (optional — used automatically if RPC_HTTPS_URL is down or rate-limited)
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY                 (optional — enables push)
#   GOPLUS_APP_KEY, GOPLUS_APP_SECRET                   (optional — higher rate limit)
# See backend/.env.example for the full list and how to get each one.

on:
  schedule:
    - cron: "0 */5 * * *" # every 5 hours — see the note above on why this is safe
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

concurrency:
  group: bnbprint-scanner
  cancel-in-progress: false # let an overlapping run finish naturally rather than killing it

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # just under GitHub's 360-minute hard cap per job
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run scanner
        run: python scan_runner.py
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'true' }}
          RPC_HTTPS_URL: ${{ secrets.RPC_HTTPS_URL }}
          RPC_HTTPS_URL_FALLBACK: ${{ secrets.RPC_HTTPS_URL_FALLBACK }}
          CHAIN_ID: "56"
          FOUR_MEME_FACTORY: ${{ vars.FOUR_MEME_FACTORY || '0x5c952063c7fc8610FFDB798152D69F0B9550762b' }}
          GRAFUN_FACTORY: ${{ vars.GRAFUN_FACTORY || '0x8341b19a2A602eAE0f22633b6da12E1B016E6451' }}
          EXTRA_BONDING_FACTORIES: ${{ vars.EXTRA_BONDING_FACTORIES }}
          GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
          GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
          AVE_AI_API_KEY: ${{ secrets.AVE_AI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:you@example.com' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RUNNER_SCORE_THRESHOLD: ${{ vars.RUNNER_SCORE_THRESHOLD || '70' }}
          MIN_SECURITY_SCORE: ${{ vars.MIN_SECURITY_SCORE || '50' }}
          DEAD_BONDING_MINUTES: ${{ vars.DEAD_BONDING_MINUTES || '30' }}
